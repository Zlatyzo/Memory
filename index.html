<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Memory - TD Javascript</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="JS/script.js" defer></script>
</head>
<body>
    <header class="game-header">
        <h1>Jeu de Memory</h1>
        <p class="subtitle">Trouvez les 8 paires d'images identiques !</p>
    </header>

    <main class="game-container">
        <section class="game-dashboard" aria-label="Statistiques de la partie">
            <div id="moves" class="stat-box">Coups : 0</div>
            <div id="timer" class="stat-box">Temps : 00:00</div>
        </section>

  
        <div id="result" class="result-message"></div>

        <section id="game-board" class="board-grid" aria-label="Plateau de jeu du memory"></section>
        <div class="controls">
            <button id="restart-btn" class="btn-restart">Recommencer la partie</button>
        </div>
    </main>

</body>
</html>
